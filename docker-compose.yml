services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ejeuno
      POSTGRES_PASSWORD: ejeuno
      POSTGRES_DB: ejeuno
    ports:
      - "5432:5432"
    volumes:
      - ejeuno_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ejeuno -d ejeuno"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://ejeuno:ejeuno@db:5432/ejeuno
      AUTH_SECRET: ejeuno-dev-secret-cambia-en-prod
      APP_URL: http://localhost:3000
      PORT: "3000"
      RUN_SEED: "true"
    depends_on:
      db:
        condition: service_healthy

volumes:
  ejeuno_pg:
