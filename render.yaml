databases:
  - name: ejeuno-db
    plan: basic-256mb

services:
  - type: web
    name: ejeuno-web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOSTNAME
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: ejeuno-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: RUN_SEED
        value: "true"
